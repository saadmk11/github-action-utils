name: Changelog CI

on:
  pull_request:
    types: [ opened ]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Run Changelog CI
        uses: saadmk11/changelog-ci@5b5ee0d3959eb63923c59d42ccd4afac1321b034 # v2.0.3
