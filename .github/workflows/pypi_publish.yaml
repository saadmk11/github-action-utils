name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Resolve and validate an existing published release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.11 python scripts/check_distribution.py --github-release

  validate:
    needs: release
    uses: ./.github/workflows/test.yaml

  showcase:
    needs: release
    uses: ./.github/workflows/showcase.yaml

  build:
    needs: [release, validate, showcase]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build and verify the exact release distributions
        run: |
          uv sync --locked
          uv build --clear
          uv run --locked python scripts/check_distribution.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Publish the checked bytes with Trusted Publishing
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          uv publish --trusted-publishing always ./*.whl ./*.tar.gz

  verify-release:
    needs: [release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
      - name: Install and verify the published distribution in a clean environment
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          uv venv --python 3.11 /tmp/published
          uv pip install --refresh-package github-action-utils --python /tmp/published/bin/python "github-action-utils==$RELEASE_VERSION"
          /tmp/published/bin/python scripts/check_distribution.py --published-version "$RELEASE_VERSION"
